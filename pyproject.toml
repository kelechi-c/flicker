[project]
name = "flicker"
version = "0.1.0"
description = "JAX/TPU port of FLUX.2 [klein] 4B — text-to-image inference"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "numpy",
    "safetensors",
    "ml_dtypes",
    "pillow",
    "huggingface_hub",
    "tokenizers",
]

[project.optional-dependencies]
# torch/transformers live only in the Modal reference image and in tools/ stage-A goldens.
ref = ["torch", "transformers", "einops", "modal"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flicker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
